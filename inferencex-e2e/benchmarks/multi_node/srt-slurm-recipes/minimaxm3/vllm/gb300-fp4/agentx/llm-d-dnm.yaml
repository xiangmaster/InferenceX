# [DNM] MiniMax-M3 NVFP4 AgentX on two GB300 nodes behind the llm-d router
# (srt-slurm frontend.type: llm-d): the Endpoint Picker (EPP) behind Envoy, with
# llm-d's P/D sidecar in front of the decode worker for prefill/decode.
# The image is the vLLM nightly that SemiAnalysisAI/InferenceX#2719 runs, which
# also ships epp, pd-sidecar (llm-d-router v0.10.0), and envoy on PATH.
# Engine settings follow disagg-1p1d-smg-grpc-nixl.yaml (TP4 workers, no speculative
# decoding) over HTTP, with vLLM's own MiniMax-M3 parsers.
# Select one with CONFIG_FILE=recipes/minimaxm3/vllm/gb300-fp4/agentx/llm-d-dnm.yaml:override_<name>.

schema: 2

base:
  model:
    path: "nvidia/MiniMax-M3-NVFP4"
    container: "quay.io/rh-ee-imarkov/llm-d-nokube-vllm:dspark-0814-nightly@sha256:00742fdd10e572172d49559e44c357a68c388933c74db2c4e819bf61377a6a95"
    precision: "fp4"
  identity:
    model:
      repo: "nvidia/MiniMax-M3-NVFP4"
    container:
      image: "quay.io/rh-ee-imarkov/llm-d-nokube-vllm:dspark-0814-nightly@sha256:00742fdd10e572172d49559e44c357a68c388933c74db2c4e819bf61377a6a95"
  dynamo:
    install: false
  health_check:
    max_attempts: 2160
    interval_seconds: 10
  resources:
    gpu_type: "gb300"
    gpus_per_node: 4
  observability:
    enabled: false
    tachometer:
      enabled: false
  frontend:
    type: llm-d
    enable_multiple_frontends: false
  engine:
    type: vllm
  sbatch_directives:
    cpus-per-task: "72"
    mem: "0"
  srun_options:
    container-remap-root: ""
  benchmark:
    type: custom
    concurrencies: [8]
    command: "bash /infmax-workspace/benchmarks/srt_agentic.sh"
    env:
      INFMAX_CONTAINER_WORKSPACE: "/infmax-workspace"
      RESULT_DIR: "/logs/agentic"
      PORT: "8000"
      IS_MULTINODE: "true"
      MODEL: "nvidia/MiniMax-M3-NVFP4"
      AIPERF_DATASET_MMAP_CACHE_DIR: "/aiperf_mmap_cache"
      HF_HUB_CACHE: "/hf_hub_cache"
      WEKA_LOADER_OVERRIDE: "semianalysis_cc_traces_weka_062126"
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: "vllm:"

# Two aggregated TP4 workers, one per node; the EPP picks one per request.
override_agg:
  name: "minimax-m3-vllm-agg-gb300-2xtp4-llm-d-agentic"
  frontend:
    epp_config:
      plugins:
        - type: approx-prefix-cache-producer
        - type: prefix-cache-scorer
        - type: queue-scorer
        - type: max-score-picker
      schedulingProfiles:
        - name: default
          plugins:
            - pluginRef: prefix-cache-scorer
              weight: 3
            - pluginRef: queue-scorer
              weight: 2
            - pluginRef: max-score-picker
  roles:
    agg:
      nodes: 2
      workers: 2
      gpus: 4
      env: &env
        HF_HUB_CACHE: "/hf_hub_cache"
        HUGGINGFACE_HUB_CACHE: "/hf_hub_cache"
        PYTHONNOUSERSITE: "1"
        VLLM_ENGINE_READY_TIMEOUT_S: "3600"
        VLLM_FLOAT32_MATMUL_PRECISION: "high"
        VLLM_FLASHINFER_ALLREDUCE_BACKEND: "trtllm"
        VLLM_USE_NCCL_SYMM_MEM: "0"
        VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
        UCX_MEMTYPE_CACHE: "n"
        UCX_CUDA_IPC_ENABLE_MNNVL: "y"
        UCX_RNDV_PIPELINE_ERROR_HANDLING: "y"
        NCCL_CUMEM_ENABLE: "1"
        NCCL_MNNVL_ENABLE: "1"
        NCCL_NVLS_ENABLE: "1"
        NCCL_IB_HCA: "mlx5_0,mlx5_1,mlx5_2,mlx5_3"
      args: &args
        served-model-name: "nvidia/MiniMax-M3-NVFP4"
        tensor-parallel-size: 4
        gpu-memory-utilization: 0.9
        block-size: 128
        language-model-only: true
        enable-prefix-caching: true
        enable-chunked-prefill: true
        no-enable-flashinfer-autotune: true
        reasoning-parser: minimax_m3
        tool-call-parser: minimax_m3
        enable-auto-tool-choice: true
        attention-config: '{"backend":"FLASHINFER","use_trtllm_attention":true,"indexer_kv_dtype":"fp8"}'
        kv-cache-dtype: fp8
        max-num-batched-tokens: 16384
        max-num-seqs: 16
        stream-interval: 20
        trust-remote-code: true

# One TP4 prefill and one TP4 decode worker on separate nodes, KV over NIXL. The EPP
# picks the decode sidecar and names the prefill worker on every request.
override_1p1d:
  name: "minimax-m3-vllm-disagg-gb300-1p1d-tp4-tp4-llm-d-agentic"
  frontend:
    epp_config:
      plugins:
        - type: prefill-filter
        - type: decode-filter
        - type: approx-prefix-cache-producer
        - type: prefix-cache-scorer
        - type: queue-scorer
        - type: always-disagg-pd-decider
        - type: disagg-profile-handler
          parameters:
            deciders:
              prefill: always-disagg-pd-decider
        - type: max-score-picker
      schedulingProfiles:
        - name: prefill
          plugins:
            - pluginRef: prefill-filter
            - pluginRef: prefix-cache-scorer
              weight: 3
            - pluginRef: queue-scorer
              weight: 2
            - pluginRef: max-score-picker
        - name: decode
          plugins:
            - pluginRef: decode-filter
            - pluginRef: queue-scorer
            - pluginRef: max-score-picker
  engine:
    connector: nixl
  roles:
    prefill:
      nodes: 1
      workers: 1
      gpus: 4
      env: *env
      args: *args
    decode:
      nodes: 1
      workers: 1
      gpus: 4
      env: *env
      args: *args
